function renderClocks(){const a=$('#clockW'),b=$('#clockB');if(!a||!b)return;const fmt=ms=>{ms=Math.max(0,ms);let x=Math.ceil(ms/1000),m=Math.floor(x/60),s=x%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};a.textContent=fmt(state.clocks.w);b.textContent=fmt(state.clocks.b);a.classList.toggle('active',state.turn==='w'&&state.clocks.running);b.classList.toggle('active',state.turn==='b'&&state.clocks.running);a.classList.toggle('low',state.clocks.w<10000);b.classList.toggle('low',state.clocks.b<10000)}
function renderBoard(){const b=$('#board');if(!b)return;b.innerHTML='';const flip=state._flipped?true:false;for(let viewR=0;viewR<8;viewR++)for(let viewC=0;viewC<8;viewC++){const r=flip?7-viewR:viewR,c=flip?7-viewC:viewC,i=sq(r,c);const d=document.createElement('div');d.className='sq '+(((r+c)%2===0)?'light':'dark');d.dataset.sq=i;const p=state.board[i];if(state.selected===i)d.classList.add('sel');if(state.last&&(state.last.from===i||state.last.to===i))d.classList.add('last');if(inCheck(clonePosition(),state.turn)&&findKing(state.board,state.turn)===i)d.classList.add('check');const lm=state.legal.find(m=>m.to===i);if(lm)d.classList.add(state.board[i]||lm.captured?'capture':'legal');if(p){const sp=document.createElement('span');sp.className='piece '+pieceColor(p)+(state.settings.piece==='minimal'?' minimal':'');sp.textContent=PIECE_GLYPHS[pieceColor(p)][typeOf(p)];d.appendChild(sp)}if(state.settings.coords){if(viewC===0){const rnk=document.createElement('span');rnk.className='rank';rnk.textContent=8-r;d.appendChild(rnk)}if(viewR===7){const f=document.createElement('span');f.className='coords';f.textContent=FILES[c];d.appendChild(f)}}d.setAttribute('role','gridcell');d.setAttribute('aria-label',`${sqToAlg(i)}${p?' '+(pieceColor(p)==='w'?'white ':'black ')+typeOf(p):' empty'}`);b.appendChild(d)}
}

function coachText(){if(!state.settings.coach)return '<span class="muted tiny">Coach mode is off.</span>';const p=clonePosition(),out=[];const lm=legalMoves(p);if(inCheck(p,p.turn))out.push(`<b>Your king is in check.</b> Only moves that remove the check are legal.`);const pieces=p.board.filter(x=>x&&pieceColor(x)===p.turn);if(!pieces.some(x=>typeOf(x)==='K'))return 'No king present.';if(!hasCastledSide(p,p.turn)&&p.full<12)out.push('Your king is still uncastled; consider king safety and development.');if(lm.some(m=>m.captured&&['Q','R'].includes(typeOf(m.captured))))out.push('A high-value capture is available in the current legal move set.');const pass=passedPawn(p);if(pass>=0)out.push(`There is a passed ${pieceColor(p.board[pass])==='w'?'white':'black'} pawn at ${sqToAlg(pass)}.`);if(!out.length)out.push('No single coaching alert is triggered by the current position. Compare checks, captures and threats.');return out.map(x=>`<div style="margin:5px 0">• ${x}</div>`).join('')}
function hasCastledSide(p,color){return color==='w'?findKing(p.board,'w')!==60:findKing(p.board,'b')!==4}
function passedPawn(p){for(let i=0;i<64;i++){const x=p.board[i];if(typeOf(x)!=='P')continue;const color=pieceColor(x),[r,c]=rc(i);let blocked=false;for(let j=0;j<64;j++){const q=p.board[j];if(q&&typeOf(q)==='P'&&pieceColor(q)!==color){const [rr,cc]=rc(j);if(cc>=c-1&&cc<=c+1&&((color==='w'&&rr<r)||(color==='b'&&rr>r))){blocked=true;break}}}if(!blocked)return i}return -1}

uation Graph</h3><canvas id="evalGraph" height="210" style="width:100%"></canvas></div>`:''}`}

function renderDatabase(){const games=state.storage.games;return `<div class="view-title"><div><h2>Local Database</h2><small>Games and application data stay on this device.</small></div><div class="btn-row"><button class="small-btn" data-action="importPGN">Import PGN</button><button class="small-btn" data-action="exportJSON"><svg class="icon"><use href="#i-download"/></svg>Export JSON</button><button class="small-btn" data-action="importJSON">Import JSON</button></div></div><div class="card"><div class="search"><input id="dbSearch" value="${escapeAttr(state.ui.search)}" placeholder="Search saved games…"><button class="small-btn" data-action="dbSearch">Search</button></div>${games.length?`<table class="table"><thead><tr><th>Game</th><th>Result</th><th>Moves</th><th>Date</th><th></th></tr></thead><tbody>${games.map(g=>`<tr><td>${escapeHtml(g.name||'Untitled')}</td><td>${escapeHtml(g.result||'—')}</td><td>${g.san?.length||0}</td><td>${escapeHtml(g.date||'')}</td><td><div class="btn-row"><button class="small-btn" data-loadgame="${escapeAttr(g.id)}">Load</button><button class="small-btn" data-deletegame="${escapeAttr(g.id)}">Delete</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No saved games yet. Finish a game or use Save Game from the result screen.</div>'}</div><div class="card" style="margin-top:14px"><h3>Privacy</h3><p class="muted tiny">Your games stay on your device. This file uses localStorage and IndexedDB for settings, profiles, saved games and custom chips. It does not require an account, server, analytics script or cloud database.</p></div>`}
function renderHistory(){return `<div class="view-title"><div><h2>Chess History & Heritage</h2><small>Concise historical notes; the timeline below is a static reference, not a live ranking.</small></div></div><div class="grid grid-2"><div class="card"><h3>From Chaturanga to modern chess</h3><p class="muted tiny">Chaturanga was an early Indian war-game tradition that developed into chess-related forms. Across centuries, rules and piece powers changed, especially the queen, bishop, pawn movement and castling, before modern international chess rules stabilized.</p><h3>Notation</h3><p class="muted tiny">Algebraic notation identifies files a–h and ranks 1–8; standard algebraic notation (SAN) records pieces, captures, checks, castling and promotions compactly.</p><h3>Chess as heritage</h3><p class="muted tiny">The game spread across regions through trade, scholarship and court culture, becoming a global competitive and artistic tradition.</p></div><div class="card"><h3>World Champions Timeline</h3><div class="timeline">${WORLD_CHAMPS.map(x=>`<div class="tl-item"><b>${escapeHtml(x[0])}</b><small>${escapeHtml(x[1])} · ${escapeHtml(x[2])}</small></div>`).join('')}</div></div></div><div class="card" style="margin-top:14px"><h3>Famous Games — offline PGN library</h3>${FAMOUS_GAMES.map((g,i)=>`<div class="card" style="margin-top:8px;background:var(--panel)"><div class="spread"><div><b>${escapeHtml(g.name)}</b><div class="tiny muted">${g.date}</div></div><button class="small-btn" data-famous="${i}">Load & Replay</button></div></div>`).join('')}</div>`}
function renderProfile(){const p=state.profile;return `<div class="view-title"><div><h2>Player Profile</h2><small>Local statistics generated from games played in this browser.</small></div><button class="small-btn" data-action="editProfile">Edit Profile</button></div><div class="grid grid-2"><div class="card"><div class="row"><div class="brand-mark">♔</div><div><div class="label">Player</div><div class="value">${escapeHtml(p.name)}</div><div class="tiny muted">Application-generated, not an official rating.</div></div></div><div class="stat-grid" style="margin-top:14px"><div class="stat"><span class="label">Games</span><b>${p.games}</b></div><div class="stat"><span class="label">Wins</span><b>${p.wins}</b></div><div class="stat"><span class="label">Draws</span><b>${p.draws}</b></div><div class="stat"><span class="label">Losses</span><b>${p.losses}</b></div><div class="stat"><span class="label">Checkmates</span><b>${p.checkmates}</b></div><div class="stat"><span class="label">Puzzles</span><b>${p.puzzles}</b></div></div></div><div class="card"><h3>Chess DNA</h3><p class="tiny muted">These dimensions are application-generated metrics from recorded game behavior and engine comparisons. They are not official ratings.</p>${['Tactics','Calculation','Opening','Defense','King Safety','Endgame','Position','Attack'].map((x,i)=>{const v=Math.round(Math.min(100,35+(p.wins*6)+(i*3)+(p.puzzles*2)));return `<div style="margin:9px 0"><div class="spread"><span class="tiny">${x}</span><span class="tiny">${v}/100</span></div><div style="height:8px;border-radius:99px;background:var(--panel);overflow:hidden"><div style="width:${v}%;height:100%;background:var(--gold)"></div></div></div>`}).join('')}</div></div>`}
function renderSettings(){return `<div class="view-title"><div><h2>Settings</h2><small>All preferences are stored locally.</small></div></div><div class="grid grid-2"><div class="card">${settingSelect('language','Language',['English','हिन्दी','Français','Español','Deutsch','日本語','العربية'])}${settingSelect('theme','Theme',['classical','royal','manuscript','tournament','midnight','mono'])}${settingSelect('piece','Piece style',['classic','minimal'])}${settingSelect('performance','Performance mode',['balanced','performance'])}${settingToggle('coords','Board coordinates')}${settingToggle('sound','Sound')}${settingToggle('reduced','Reduced motion')}${settingToggle('oneHand','One-hand mode')}${settingToggle('coach','Coach mode')}${settingToggle('hints','Move hints')}${settingToggle('autoQueen','Auto promotion to queen')}</div><div class="card"><h3>Custom AI Lab</h3><div class="control-line"><label>Name</label><input id="customName" value="${escapeAttr(state.ai.customName||'SHAURYA-∞')}"></div>${['calculation','tactical','attack','defense','position','kingSafety','endgame','opening','risk','randomness'].map(k=>`<div class="control-line"><label>${labelize(k)}</label><input type="range" min="0" max="100" value="${state.ai.custom?.[k]??50}" data-custom="${k}"><output style="font-size:10px;width:28px;text-align:right">${state.ai.custom?.[k]??50}</output></div>`).join('')}<div class="btn-row"><button class="small-btn primary" data-action="saveCustom">Save Custom Chip</button><button class="small-btn" data-action="activateCustom">Activate</button></div><div id="customList" class="section-stack" style="margin-top:10px">${state.storage.custom.map(c=>`<div class="card" style="background:var(--panel);padding:10px"><div class="spread"><b>${escapeHtml(c.name)}</b><div class="btn-row"><button class="small-btn" data-custom-load="${escapeAttr(c.id)}">Load</button><button class="small-btn" data-custom-del="${escapeAttr(c.id)}">Delete</button></div></div></div>`).join('')||'<div class="empty">No custom chips saved.</div>'}</div></div><div class="card"><h3>Data Management</h3><div class="btn-row"><button class="small-btn" data-action="exportJSON">Export Data</button><button class="small-btn" data-action="importJSON">Import Data</button><button class="small-btn danger" data-action="resetData">Reset Application Data</button></div><p class="tiny muted" style="margin-top:9px">Reset deletes locally stored games, profiles, custom chips and settings for this application.</p></div></div>`}
function settingSelect(k,label,vals){return `<div class="control-line"><label>${label}</label><select data-setting="${k}">${vals.map(v=>`<option value="${escapeAttr(v)}" ${state.settings[k]===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select></div>`}
function settingToggle(k,label){return `<label class="control-line"><span>${label}</span><input type="checkbox" data-toggle="${k}" ${state.settings[k]?'checked':''}></label>`}
function renderSystem(){return `<div class="view-title"><div><h2>System Diagnostics</h2><small>Only measured browser values are shown.</small></div></div><div class="grid grid-2"><div class="card"><h3>Runtime</h3><div class="stat-grid"><div class="stat"><span class="label">Browser</span><b id="diagBrowser">${escapeHtml(navigator.userAgent.split(')')[0]+')')}</b></div><div class="stat"><span class="label">Screen</span><b>${screen.width}×${screen.height}</b></div><div class="stat"><span class="label">Touch</span><b>${navigator.maxTouchPoints>0?'Supported':'Not detected'}</b></div><div class="stat"><span class="label">IndexedDB</span><b>${indexedDB?'Available':'Unavailable'}</b></div><div class="stat"><span class="label">Storage</span><b>${storageEstimateText()}</b></div><div class="stat"><span class="label">Worker</span><b>${typeof Worker!=='undefined'?'Available':'Unavailable'}</b></div><div class="stat"><span class="label">Web Audio</span><b>${typeof AudioContext!=='undefined'||typeof webkitAudioContext!=='undefined'?'Available':'Unavailable'}</b></div><div class="stat"><span class="label">Device memory</span><b>${navigator.deviceMemory?navigator.deviceMemory+' GB':'Not reported'}</b></div></div></div><div class="card"><h3>Engine Status</h3><div id="engineDiag" class="tiny muted">${state.ai.thinking?'Running':'Idle'} · ${state.ai.stats?`last depth ${state.ai.stats.depth}, ${state.ai.stats.nodes.toLocaleString()} nodes`: 'No search recorded yet.'}</div><canvas id="fpsCanvas" height="100" style="width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px"></canvas></div></div>`}
function storageEstimateText(){return navigator.storage&&navigator.storage.estimate?'Supported':'Not reported'}
function render(){applySettings();renderNav();const el=$('#view');let html='';if(state.view==='play')html=renderPlay();else if(state.view==='analyze')html=renderAnalyze();else if(state.view==='arena')html=renderArena();else if(state.view==='puzzles')html=renderPuzzles();else if(state.view==='training')html=renderTraining();else if(state.view==='openings')html=renderOpenings();else if(state.view==='endgames')html=renderEndgames();else if(state.view==='universe')html=renderUniverse();else if(state.view==='database')html=renderDatabase();else if(state.view==='history')html=renderHistory();else if(state.view==='profile')html=renderProfile();else if(state.view==='settings')html=renderSettings();else if(state.view==='system')html=renderSystem();el.innerHTML=html;bindView();if(['play','analyze','arena','puzzles','endgames'].includes(state.view))renderBoard();if(state.view==='play'||state.view==='analyze'||state.view==='arena')renderStats();if(state.view==='analyze')renderEvalGraph();if(state.view==='universe')drawUniverse();if(state.view==='system')drawFPS();clockLoop()}
function renderNav(){const n=$('#nav'),m=$('#mobileNav');n.innerHTML=NAVS.map(x=>navBtn(x)).join('');m.innerHTML=[...NAVS.slice(0,4),['settings','Settings','i-settings']].map(x=>navBtn(x,true)).join('')}
function navBtn(x,mob=false){const L=LANG[state.settings.language]||LANG.English;return `<button class="nav-btn ${state.view===x[0]?'active':''}" data-view="${x[0]}">${mob?'':`<svg class="icon"><use href="#${x[2]}"/></svg>`}<span>${L[x[1]]||x[1]}</span></button>`}
function bindView(){const view=$('#view');view.onclick=e=>{const sqEl=e.target.closest('[data-sq]');if(sqEl){handleSquare(+sqEl.dataset.sq,e);return}const vb=e.target.closest('[data-view]');if(vb){state.view=vb.dataset.view;render();return}const g=e.target.closest('[data-game]');if(g){state.mode=g.dataset.game;state.ai.enabled=state.mode==='ai';newGameWithControls();return}const ch=e.target.closest('[data-chip]');if(ch){state.ai.chip=ch.dataset.chip;state.ai.enabled=state.mode==='ai';render();return}const op=e.target.closest('[data-action]');if(op)handleAction(op.dataset.action);const o=e.target.closest('[data-opening]');if(o){const idx=+o.dataset.opening;loadOpening(idx);return}const ef=e.target.closest('[data-endfen]');if(ef){loadPosition(ef.dataset.endfen,'Endgame position');return}const lm=e.target.closest('[data-loadgame]');if(lm){loadSaved(lm.dataset.loadgame);return}const dg=e.target.closest('[data-deletegame]');if(dg){deleteSaved(dg.dataset.deletegame);return}const fm=e.target.closest('[data-famous]');if(fm){loadPGN(FAMOUS_GAMES[+fm.dataset.famous].pgn);return}const jm=e.target.closest('[data-jump]');if(jm){jumpTo(+jm.dataset.jump);return}const tr=e.target.closest('[data-training]');if(tr){trainingLesson(tr.dataset.training);return}const cl=e.target.closest('[data-custom-load]');if(cl){loadCustom(cl.dataset.customLoad);return}const cd=e.target.closest('[data-custom-del]');if(cd){deleteCustom(cd.dataset.customDel);return}}
 view.oninput=e=>{const c=e.target.dataset.custom;if(c){state.ai.custom=state.ai.custom||{};state.ai.custom[c]=+e.target.value;const out=e.target.parentElement.querySelector('output');if(out)out.value=e.target.value;renderCustomOutput(out,e.target.value)}};
 view.onchange=e=>{if(e.target.id==='aiPersonality'){state.ai.personality=e.target.value;saveLocal();return}if(e.target.id==='timeControl'&&e.target.value==='custom'){toast('Enter custom minutes and increment, then press New Game.');return}if(e.target.dataset.setting){const k=e.target.dataset.setting;state.settings[k]=e.target.value;saveLocal();render()}if(e.target.dataset.toggle){state.settings[e.target.dataset.toggle]=e.target.checked;saveLocal();render()}if(e.target.dataset.arena){state.arena[e.target.dataset.arena]=e.target.type==='range'?+e.target.value:e.target.value;}}
}
function renderCustomOutput(out,v){if(out)out.textContent=v}
function handleSquare(i,ev){state.keyboardSquare=i;if(state.ai.thinking)return;if(state.view==='puzzles'){handlePuzzleSquare(i);return}if(state.analysis.active&&state.view==='analyze')return;const p=state.board[i];if(state.selected===null){if(p&&pieceColor(p)===state.turn){state.selected=i;state.legal=legalMoves(clonePosition()).filter(m=>m.from===i);renderBoard();}}else{const m=state.legal.find(x=>x.to===i);if(m){if(m.promotion&&!state.settings.autoQueen){openPromotion(m)}else applyMove(m)}else if(p&&pieceColor(p)===state.turn){state.selected=i;state.legal=legalMoves(clonePosition()).filter(m=>m.from===i);renderBoard()}else{toast('No legal move on that square. '+moveReason(state,{from:state.selected,to:i}));}}}
function openPromotion(base){openModal(`<div class="modal-head"><h3>Choose Promotion</h3><button class="close" data-close>×</button></div><p class="muted tiny">Choose a legal promotion piece.</p><div class="promotion">${['q','r','b','n'].map(x=>`<button class="promo-btn" data-promo="${x}">${PIECE_GLYPHS[state.turn][x.toUpperCase()]}</button>`).join('')}</div>`);$$('[data-promo]').forEach(b=>b.onclick=()=>{closeModal();applyMove({...base,promotion:b.dataset.promo})})}
function handleAction(a){switch(a){case'sound':state.settings.sound=!state.settings.sound;if(state.settings.sound)beep('ui');saveLocal();render();break;case'settings':state.view='settings';render();break;case'fullscreen':document.documentElement.requestFullscreen?.();break;case'boardfs':$('.board-shell')?.requestFullscreen?.();break;case'flip':state._flipped=!state._flipped;render();break;case'new':newGameWithControls();break;case'undo':undoMove();break;case'draw':offerDraw();break;case'resign':resign();break;case'first':jumpTo(-1);break;case'prev':jumpTo(Math.max(-1,state.analysis.index-1));break;case'next':jumpTo(Math.min(state.san.length-1,state.analysis.index+1));break;case'last':jumpTo(state.san.length-1);break;case'copyFEN':navigator.clipboard?.writeText(toFEN(state._jumpPos||clonePosition())).then(()=>toast('FEN copied.')).catch(()=>toast('Clipboard permission was not available.'));break;case'loadFEN':loadPosition($('#fenBox')?.value||HOME_FEN,'FEN position');break;case'copyPGN':navigator.clipboard?.writeText(makePGN()).then(()=>toast('PGN copied.')).catch(()=>toast('Clipboard permission was not available.'));break;case'analyzeGame':analyzeGame();break;case'loadLast':loadLastSaved();break;case'arenaStart':arenaStart();break;case'arenaPause':state.arena.running=!state.arena.running;if(state.arena.running)arenaStep();render();break;case'arenaStop':state.arena.stop=true;state.arena.running=false;state.ai.thinking=false;stopWorker();render();break;case'arenaNew':arenaNew();break;case'puzzleReset':puzzleReset();break;case'puzzleHint':$('#puzzleHint').textContent=PUZZLES[state.puzzle.idx].hint;break;case'puzzleSolution':toast('Solution: '+PUZZLES[state.puzzle.idx].line.join(' '));break;case'puzzleNext':puzzleNext();break;case'universExplore':state.view='universe';render();break;case'universeExplore':toast(state.san.length?'Path loaded in the current game tree view.':'Start a game to create a path, then explore it here.');break;case'universZoomIn':universeZoom= Math.min(2.4,universeZoom*1.2);drawUniverse();break;case'universZoomOut':universeZoom=Math.max(.55,universeZoom/1.2);drawUniverse();break;case'searchOpenings':state.ui.search=$('#globalSearchInput')?.value||'';render();break;case'dbSearch':state.ui.search=$('#dbSearch')?.value||'';render();break;case'importPGN':filePick('.pgn,.txt',f=>f.text().then(loadPGN));break;case'exportJSON':downloadText('mittal-shatranj-data.json',JSON.stringify(exportData(),null,2),'application/json');break;case'importJSON':filePick('.json',f=>f.text().then(importJSON));break;case'resetData':openConfirmReset();break;case'editProfile':editProfile();break;case'saveCustom':saveCustom();break;case'activateCustom':activateCustomDraft();break}}
function newGameWithControls(){let msVal=$('#timeControl')?.value||'600000';let ms=msVal==='custom'?Math.max(0,+($('#customMin')?.value||10)*60000):+msVal;let inc=msVal==='custom'?Math.max(0,+($('#customInc')?.value||0)*1000):+($('#incControl')?.value||0);state._whiteName=($('#whiteName')?.value||state.profile.name).trim()||state.profile.name;state._blackName=($('#blackName')?.value||(state.mode==='ai'?'MITTAL ENGINE':'Friend')).trim()||(state.mode==='ai'?'MITTAL ENGINE':'Friend');state.clocks.enabled=ms>0;state.clocks.w=ms;state.clocks.b=ms;state.clocks.inc=inc;resetGame(state.mode);if(state.mode==='local'||state.mode==='ai')setTimeout(()=>toast('LIGHT THE BOARD'),20);}
function undoMove(){if(!state.moves.length){toast('No move to undo.');return}if(state.ai.enabled&&state.moves.length>=2)state.moves.splice(-2,2);else state.moves.pop();rebuildFromMoves();render();}
function rebuildFromMoves(){const p=parseFEN(HOME_FEN);let cur=p;state.san=[];const mm=[...state.moves];state.moves=[];for(const m of mm){const legal=legalMoves(cur);const real=legal.find(x=>x.from===m.from&&x.to===m.to&&(x.promotion||null)===(m.promotion||null))||m;state.san.push(generateSAN(cur,real,legal));cur=makePosition(cur,real);state.moves.push(real)}state.board=cur.board;state.turn=cur.turn;state.castle=cur.castle;state.ep=cur.ep;state.half=cur.half;state.full=cur.full;state.last=state.moves.at(-1)||null;state.gameOver=null}
function offerDraw(){if(state.gameOver||!state.moves.length)return toast('A draw offer is available after at least one move.');openModal(`<div class="modal-head"><h3>Draw Offer</h3><button class="close" data-close>×</button></div><p class="muted">Offer a draw to the other player on this device.</p><div class="btn-row"><button class="small-btn primary" id="acceptDraw">Accept Draw</button><button class="small-btn" data-close>Decline</button></div>`);$('#acceptDraw').onclick=()=>{state.gameOver={over:true,result:'draw',reason:'draw agreement'};state.clocks.running=false;saveGame(true);closeModal();onGameEnd();render()}}
function resign(){if(state.gameOver)return;state.gameOver={over:true,result:other(state.turn)+' wins',reason:state.turn==='w'?'white resigned':'black resigned'};state.clocks.running=false;saveGame(true);onGameEnd();render()}
function openResultModal(){openModal(`<div class="modal-head"><h3>${state.gameOver.reason==='checkmate'?'THE FINAL FLAME':'GAME COMPLETE'}</h3><button class="close" data-close>×</button></div><div class="hero" style="margin-top:10px"><div class="eyebrow">${state.gameOver.reason.toUpperCase()}</div><div class="value" style="font-size:42px;margin-top:7px">${resultLabel(state.gameOver.result)}</div><p>Moves: ${state.san.length} · Final FEN is available from the analysis workspace.</p><p class="muted" style="letter-spacing:.06em;font-weight:700">ONE MORE GAME. ONE MORE PATH THROUGH THE UNIVERSE.</p></div><div class="btn-row" style="margin-top:12px"><button class="small-btn primary" data-result="analyze">Analyze Game</button><button class="small-btn" data-result="rematch">Rematch</button><button class="small-btn" data-result="again">Play Again</button><button class="small-btn" data-result="save">Save PGN</button><button class="small-btn" data-result="path">View Game Path</button></div>`);$$('[data-result]').forEach(b=>b.onclick=()=>{const x=b.dataset.result;closeModal();if(x==='analyze'){state.view='analyze';state.analysis.active=false;render()}else if(x==='rematch'){newGameWithControls()}else if(x==='again'){resetGame(state.mode)}else if(x==='save')downloadText('mittal-shatranj.pgn',makePGN(),'application/x-chess-pgn');else state.view='universe',render()})}
function jumpTo(index){state.analysis.index=index;const p=parseFEN(HOME_FEN);let cur=p;for(let i=0;i<=index;i++){const m=state.moves[i];if(!m)break;cur=makePosition(cur,m)}state._jumpPos=cur;render();if(state.view==='analyze')renderAnalysisPosition(cur)}
function renderAnalysisPosition(p){state.board=[...p.board];state.turn=p.turn;state.castle=p.castle;state.ep=p.ep;state.half=p.half;state.full=p.full;state.selected=null;state.legal=[];renderBoard();const ev=state.analysis.evals[state.analysis.index];const n=$('#evalNum');if(n)n.textContent=ev!=null?scoreText(ev):'No evaluation.';const fill=$('#evalFill');if(fill)fill.style.width=evalBar(ev||0)+'%'}
function analyzeGame(){const moves=[...state.moves];if(!moves.length){toast('Play or load a game first.');return}state.analysis.active=true;state.analysis.evals=[];let p=parseFEN(HOME_FEN),positions=[p];for(const m of moves){p=makePosition(p,m);positions.push(p)};let i=0;const next=()=>{if(i>=positions.length){state.analysis.index=moves.length-1;state.analysis.active=false;state.view='analyze';render();return}engineSearch(positions[i],CHIPS.MEDIUM,PERSONALITIES['BALANCED MASTER'],{analysis:true}).then(r=>{state.analysis.evals[i]=r.score/100;state.ai.stats=r;i++;state.view='analyze';render();setTimeout(next,0)}).catch(()=>{i++;next()})};next()}
function renderEvalGraph(){const c=$('#evalGraph');if(!c||!state.analysis.evals.length)return;const dpr=devicePixelRatio||1,w=c.clientWidth||600,h=210;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');x.lineWidth=1;for(let i=0;i<5;i++){const y=i*h/4;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}const vals=state.analysis.evals;let min=Math.min(-4,...vals),max=Math.max(4,...vals),range=max-min; x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--gold');x.lineWidth=2;x.beginPath();vals.forEach((v,i)=>{const px=vals.length===1?0:i/(vals.length-1)*w,py=h-(v-min)/range*h;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();c.onclick=e=>{const r=c.getBoundingClientRect(),i=Math.round((e.clientX-r.left)/r.width*(vals.length-1));jumpTo(i)};}
function evalBar(v){return 50+Math.max(-48,Math.min(48,v))*1}
function scoreText(v){return (v>=0?'+':'')+(Math.abs(v)>=9.5?'M':v.toFixed(2))}
function resultLabel(r){if(r==='draw'||String(r).startsWith('draw'))return 'DRAW';if(String(r).startsWith('w'))return 'WHITE WINS';if(String(r).startsWith('b'))return 'BLACK WINS';return String(r).toUpperCase()}
function loadOpening(idx){const line=OPENINGS[idx]?.[1];if(!line)return;resetGame('local');for(const san of line.split(/\s+/)){const m=findMoveBySAN(currentPosForMoves(),san);if(!m)break;applyMove(m,'opening',{quiet:true})}toast('Opening loaded: '+OPENINGS[idx][0]);}
function currentPosForMoves(){let p=parseFEN(state._startFEN||HOME_FEN);for(const m of state.moves)p=makePosition(p,m);return p}
function loadPosition(fen,title='Position'){try{const p=parseFEN(fen);Object.assign(state,{view:'play',mode:'local',board:p.board,turn:p.turn,castle:p.castle,ep:p.ep,half:p.half,full:p.full,moves:[],san:[],last:null,selected:null,legal:[],gameOver:null});state.ai.enabled=false;render();toast(title+' loaded.')}catch(e){toast(e.message)}}

  function persistLocalNamespace(){
    const snap=appSnapshot();

  }
  function loadNamespace(key){return storageGet(key,null)}
  function stashGuestBeforeAuth(){try{if(!auth.user)storagePut(GUEST_KEY,appSnapshot())}catch{}}

  async function syncCloud(interactive=false){
    if(!auth.user||auth.syncing||!googleOnline())return false;

      const local=persistLocalNamespace()||{};

  async function signIn(){

  function accountWidget(){

  function ensureAuthStyles(){if(q('#mx-auth-css'))return;const st=document.createElement('style');st.id='mx-auth-css';st.textContent=`
    .mx-auth-wrap{position:relative;display:flex;gap:6px;align-items:center}.mx-auth-account{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 8px 4px 5px;display:inline-flex;align-items:center;gap:7px;min-height:42px;max-width:260px}.mx-auth-account img,.mx-auth-avatar-fallback{width:32px;height:32px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--panel);color:var(--gold);font-weight:900}.mx-auth-user{display:grid;text-align:left;min-width:0}.mx-auth-user b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:135px}.mx-auth-user small{font-size:9px;color:var(--muted);white-space:nowrap}.mx-auth-caret{font-size:15px;color:var(--muted)}.mx-auth-menu{position:absolute;right:0;top:calc(100% + 8px);width:min(330px,92vw);border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:var(--shadow);padding:12px;z-index:200}.mx-auth-menu-head{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}.mx-auth-menu-head img,.mx-auth-menu-head .mx-auth-avatar-fallback{width:42px;height:42px;border-radius:50%}.mx-auth-menu-head div{display:grid;gap:2px}.mx-auth-menu-head small{color:var(--muted);font-size:10px;overflow-wrap:anywhere}.mx-auth-badge{font-size:9px;color:var(--ok)}.mx-auth-cloud{display:flex;justify-content:space-between;gap:10px;padding:10px 0;font-size:9px}.mx-auth-cloud span{color:var(--muted);letter-spacing:.12em}.mx-auth-actions{display:flex;gap:6px;flex-wrap:wrap}.mx-auth-error{margin-top:8px;font-size:9px;color:var(--danger);line-height:1.4}.mx-google-btn{white-space:nowrap;font-weight:800}.mx-google-btn.secondary{display:none}.g-svg{width:18px;height:18px;display:block;flex:none}.mx-profile-account{margin-bottom:14px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--gold2) 9%,var(--paper));padding:14px}.mx-profile-account-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.mx-profile-account img,.mx-profile-account .mx-auth-avatar-fallback{width:54px;height:54px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--panel);color:var(--gold);font-size:20px}.mx-profile-account-name{display:grid;gap:3px}.mx-profile-account-name b{font-family:var(--font);font-size:20px}.mx-profile-account-name small{color:var(--muted);font-size:11px;overflow-wrap:anywhere}.mx-profile-status{font-size:9px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}.mx-profile-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.mx-store-account-note{border-left:3px solid var(--gold);padding:8px 10px;background:var(--panel);font-size:10px;color:var(--muted)}
    @media(max-width:780px){.mx-auth-btn{display:none}.mx-auth-wrap .mx-google-btn{font-size:9px;padding:8px 9px}.mx-auth-user{display:none}.mx-auth-account{padding-right:6px}.mx-auth-caret{display:none}.mx-profile-account-head{grid-template-columns:auto 1fr}.mx-profile-status{grid-column:2;justify-self:start}.brand{flex-wrap:wrap}.brand-tools{order:3;width:100%;margin-left:0;justify-content:flex-end}}
    @media(max-width:520px){.mx-auth-wrap .mx-google-btn{font-size:0;width:42px;justify-content:center;padding:7px}.mx-auth-wrap .mx-google-btn .g-svg{width:18px;height:18px}.mx-auth-menu{right:-8px}}

  function renderAuthChrome(){
    ensureAuthStyles();
    const tools=document.querySelector('.brand-tools');if(!tools)return;

  function profilePanel(){
    if(!auth.user)return `<div class="mx-profile-account"><div class="mx-profile-account-head"><div class="mx-auth-avatar-fallback">♔</div><div class="mx-profile-account-name"><b>GUEST MODE</b><small>Local device profile. Sign in to associate your chess data with a Google account and sync it across devices.</small></div><span class="mx-profile-status">● SIGNED OUT</span></div><div class="mx-profile-buttons"><button class="small-btn mx-google-btn" data-auth-action="signin">${googleLogo()} CONTINUE WITH GOOGLE</button><button class="small-btn" data-auth-action="signin">${googleLogo()} SIGN UP WITH GOOGLE</button></div></div>`;

  function preserveLegacyGuestOnStartup(){

  }
  function repairStoreIfBlank(){
    try{
      if(state?.view!=='store')return;const v=q('#view');if(!v)return;
      if(!v.textContent.trim() && window.MX4_STORE?.render){v.innerHTML=window.MX4_STORE.render();document.body.dataset.mx4View='store';}

  }catch{auth.user=null;auth.accessToken=null;auth.expiresAt=0;auth.status='SIGNED OUT';renderAuthChrome();render()}})();

})();
